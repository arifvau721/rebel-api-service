<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>🔥 Rebel Terabox Dashboard</title>

  <style>
    body {
      background: #0f172a;
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 { color: #38bdf8; }

    .card {
      background: #020617;
      padding: 20px;
      max-width: 500px;
      border-radius: 12px;
      border: 1px solid #1e293b;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #38bdf8;
      font-weight: bold;
      cursor: pointer;
    }

    .info {
      background: #020617;
      border: 1px dashed #334155;
      margin-top: 15px;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>🔥 Rebel Terabox Downloader</h1>

<div class="card">
  <label>📎 Terabox Link</label>
  <input id="link" placeholder="Paste Terabox link here">

  <label>⚙ Provider</label>
  <select id="provider">
    <option value="fast">TeraboxFast (default)</option>
    <option value="1024">1024 Downloader</option>
  </select>

  <button onclick="openDownloader()">🚀 Open Downloader</button>

  <div class="info" id="info">
    ℹ This tool opens a downloader page in a new tab.<br>
    ℹ No file is downloaded on the server.
  </div>
</div>

<script>
function openDownloader() {
  const url = document.getElementById("link").value.trim();
  const provider = document.getElementById("provider").value;

  if (!url) {
    alert("Paste a Terabox link first");
    return;
  }

  const apiUrl =
    `/api/terabox?url=${encodeURIComponent(url)}&provider=${provider}`;

  window.open(apiUrl, "_blank");
}
</script>

</body>
</html>
